name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node bin/meldr.js version
      - run: node tools/unused.mjs

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: the served contract must not drift from itself
        run: |
          node bin/meldr.js init demo
          cp testdata/petstore.yaml demo/contracts/api.yaml
          (cd demo && node ../bin/meldr.js serve &)
          for i in $(seq 1 60); do curl -sf localhost:3000/__meldr/health > /dev/null && break; sleep 0.5; done
          cd demo
          node ../bin/meldr.js verify --no-color
          node ../bin/meldr.js heal --check --no-color

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: stand up one honest server and one drifted one
        run: |
          node bin/meldr.js init demo-clean
          cp testdata/petstore.yaml demo-clean/contracts/api.yaml
          node bin/meldr.js init demo-drift
          cp testdata/petstore.yaml demo-drift/contracts/api.yaml
          node bin/meldr.js init demo-auth
          cp testdata/petstore.yaml demo-auth/contracts/api.yaml

          (cd demo-clean && node ../bin/meldr.js serve --port 3300 &)
          node testdata/drifted.mjs 3301 &
          (cd demo-auth && node ../bin/meldr.js serve --port 3302 --require-auth &)

          for i in $(seq 1 60); do curl -sf localhost:3300/__meldr/health > /dev/null && break; sleep 0.5; done
          for i in $(seq 1 60); do curl -sf localhost:3301/v1/pets > /dev/null && break; sleep 0.5; done
          for i in $(seq 1 60); do curl -s localhost:3302/__meldr/health > /dev/null && break; sleep 0.5; done

      - name: a clean contract passes the action
        uses: ./
        with:
          version: ${{ github.workspace }}
          working-directory: demo-clean
          base: http://127.0.0.1:3300

      - name: a drifted contract fails it
        id: drifted
        continue-on-error: true
        uses: ./
        with:
          version: ${{ github.workspace }}
          working-directory: demo-drift
          base: http://127.0.0.1:3301

      - name: the drifted run had to fail, thats the whole job
        run: |
          if [ "${{ steps.drifted.outcome }}" != "failure" ]; then
            echo "the action passed a drifted contract"
            exit 1
          fi
          if [ "${{ steps.drifted.outputs.drifted }}" != "true" ]; then
            echo "expected the drifted output to be true, got '${{ steps.drifted.outputs.drifted }}'"
            exit 1
          fi

      - name: fail-on-drift false reports without failing
        uses: ./
        with:
          version: ${{ github.workspace }}
          working-directory: demo-drift
          base: http://127.0.0.1:3301
          fail-on-drift: 'false'

      - name: without a header the auth server locks the action out
        id: noauth
        continue-on-error: true
        uses: ./
        with:
          version: ${{ github.workspace }}
          working-directory: demo-auth
          base: http://127.0.0.1:3302

      - name: the same server passes once a header is handed over
        uses: ./
        with:
          version: ${{ github.workspace }}
          working-directory: demo-auth
          base: http://127.0.0.1:3302
          headers: 'Authorization: Bearer ci-token'
          params: |
            id=1

      - name: the unauthenticated run had to fail
        run: |
          if [ "${{ steps.noauth.outcome }}" != "failure" ]; then
            echo "a 401 on every route should not look like a healthy contract"
            exit 1
          fi
