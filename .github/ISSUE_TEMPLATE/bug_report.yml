name: bug report
description: something in meldr is broken, or answers differently than the contract says
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: what happened
      description: exact commands and the full output, paste it raw
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: smallest repro
      description: the smallest contract file and command sequence that does it
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: meldr version
      placeholder: output of `meldr version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: os
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
