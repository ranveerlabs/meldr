name: feature request
description: something meldr should do and doesnt
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: problem
      description: what are you trying to do, and what is missing or painful right now
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: what you want instead
      description: what would the lazy version of this look like
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: checks
      options:
        - label: i searched the open issues and this isnt already one
          required: false
