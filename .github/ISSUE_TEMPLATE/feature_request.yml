name: Feature request
description: Suggest an idea for meldr.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would dead-simple look like for you?
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checks
      options:
        - label: I checked the roadmap in README.md and this isn't already listed
          required: false
